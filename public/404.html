<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d12" />
    <title>404 — Анатолий Чернов</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --surface: #12151c;
        --border: #232836;
        --text: #d7dbe6;
        --muted: #8a91a6;
        --accent: #6b5ce7;
        --accent-text: #8b7ff0;
        --accent-2: #3dbea8;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo,
          Consolas, monospace;
        --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
      }
      .window {
        width: min(100%, 28rem);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .chrome {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        padding: 0.7rem 0.9rem;
        border-bottom: 1px solid var(--border);
      }
      .dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #32384a;
      }
      .dot:nth-child(1) {
        background: #ff5f57;
      }
      .dot:nth-child(2) {
        background: #febc2e;
      }
      .dot:nth-child(3) {
        background: #28c840;
      }
      .title {
        margin-left: 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--muted);
      }
      .body {
        padding: 1.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: var(--font-mono);
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--accent-text);
        text-decoration: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.65rem 1rem;
      }
      a:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      a:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent-text);
      }
      .cmd {
        color: var(--accent-2);
      }
    </style>
  </head>
  <body>
    <main class="window">
      <div class="chrome">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="title">404</span>
      </div>
      <div class="body">
        <p class="cmd" id="cmd">$ open .</p>
        <h1 id="title">404 — страница не найдена</h1>
        <p id="message">Такого пути нет. Вернитесь на главную.</p>
        <a id="home" href="/">На главную</a>
      </div>
    </main>
    <script>
      ;(function () {
        try {
          var ru = !navigator.language || /^ru/i.test(navigator.language)
          if (ru) return
          document.documentElement.lang = 'en'
          document.title = '404 — Anatoly Chernov'
          document.getElementById('title').textContent = '404 — page not found'
          document.getElementById('message').textContent =
            'This path does not exist. Head back home.'
          document.getElementById('home').textContent = 'Home'
        } catch (e) {}
      })()
    </script>
  </body>
</html>
